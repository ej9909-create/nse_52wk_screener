name: keep-warm

# Pings the deployed Streamlit app so the free tier doesn't put it to sleep,
# keeping the first open of the day instant for the group.
#
# Cron is in UTC. Indian market hours 09:15-15:30 IST == 03:45-10:00 UTC.
# We ping every 15 min from 03:30-11:00 UTC, Mon-Fri, with a little padding.

on:
  schedule:
    - cron: "*/15 3-11 * * 1-5"
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

# Avoid overlapping runs if one is slow.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          URL="https://nse-52wk-screener.streamlit.app/"
          CJ="$(mktemp)"
          echo "Pinging $URL ..."
          # A cookie jar is REQUIRED: Streamlit Cloud bounces the first hit through
          # a cookie/login redirect. Without -c/-b, curl loops there and never wakes
          # the app container. With it, we complete the handshake and land on 200.
          code=$(curl -sSL -c "$CJ" -b "$CJ" -o /dev/null \
                      -w "%{http_code}" --max-time 90 "$URL" || echo "000")
          echo "app responded: HTTP $code"
          # Don't fail the job on a transient non-200 (avoids failure-email spam).
          [ "$code" = "200" ] && echo "app is awake ✅" || echo "note: non-200 (transient?)"
