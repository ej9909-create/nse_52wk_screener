name: build-snapshot

# Precomputes the daily screener snapshot (the heavy fetch) so the web app only
# has to READ + filter it — keeping the app fast and reliable. Runs after market
# close on weekdays (12:00 UTC = 17:30 IST), ~30 min after the price-band feed so
# it picks up fresh bands. Commits data/screener_snapshot.csv.

on:
  schedule:
    - cron: "7 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snapshot deps
        run: pip install -r requirements-snapshot.txt

      - name: Build snapshot
        run: python build_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_snapshot.csv
          if git diff --cached --quiet; then
            echo "no snapshot changes to commit"
          else
            git commit -m "Update screener snapshot ($(date -u +%Y-%m-%d))"
            git push
            echo "committed fresh snapshot"
          fi
