name: build-snapshot

# WEEKLY Yahoo reconciliation (Saturdays). The daily same-day refresh is Angel
# (update-daily.yml); this weekly Yahoo pass handles what Angel doesn't: split
# re-adjustment of the frontier and refreshing the 20-day average volume. Runs
# Saturday 12:07 UTC = 17:37 IST when Yahoo's week of data is fully settled.
# Commits data/screener_snapshot.csv.

on:
  schedule:
    - cron: "7 12 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screener-snapshot-write   # shared with update-daily so they never overlap
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snapshot deps
        run: pip install -r requirements-snapshot.txt

      - name: Update snapshot (append-only frontier + split re-backfill)
        run: python update_history.py

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_snapshot.csv
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Weekly Yahoo reconciliation ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main    # clean tree now; avoid non-ff reject
            git push
            echo "committed reconciliation"
          fi
